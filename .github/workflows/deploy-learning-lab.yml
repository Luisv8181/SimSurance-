name: Deploy Learning Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "learning-lab/**"
      - ".github/workflows/deploy-learning-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static Learning Lab
        shell: bash
        run: |
          set -euo pipefail
          test -s learning-lab/index.html
          grep -q '<html lang="en">' learning-lab/index.html
          grep -q 'name="viewport"' learning-lab/index.html
          grep -q 'id="allowed"' learning-lab/index.html
          grep -q 'id="case-access"' learning-lab/index.html
          grep -q 'id="glossary"' learning-lab/index.html
          echo "Learning Lab static content checks passed."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: learning-lab
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
