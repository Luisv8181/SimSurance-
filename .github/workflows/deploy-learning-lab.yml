name: Deploy Learning Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "learning-lab/**"
      - "config/**"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/deploy-learning-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate SimSurance & Learning Lab
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          node --test tests/test_visual_journey.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: learning-lab
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
