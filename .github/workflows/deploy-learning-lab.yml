name: Deploy Learning Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "learning-lab/**"
      - "tests/**"
      - "tests/**"
      - ".github/workflows/deploy-learning-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Learning Lab
        run: python -m unittest tests/test_learning_lab.py -v
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: learning-lab
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
