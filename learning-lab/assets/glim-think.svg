<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Glim, thinking and pondering a policy question" shape-rendering="crispEdges">
  <!-- Body Silhouette / Shadow Outline -->
  <rect x="14" y="14" width="36" height="36" fill="#10243f"/>
  <rect x="10" y="20" width="44" height="24" fill="#10243f"/>
  
  <!-- Antennae (One upright, one tilted in thought) -->
  <rect x="17" y="6" width="10" height="12" fill="#10243f"/>
  <rect x="37" y="10" width="10" height="10" fill="#10243f"/>
  <rect x="19" y="0" width="4" height="10" fill="#10243f"/>
  <rect x="41" y="4" width="4" height="10" fill="#10243f"/>
  <!-- Glowing Antenna Tips (Bright Thinking Bulb) -->
  <rect x="16" y="0" width="10" height="6" fill="#ffe77a"/>
  <rect x="38" y="3" width="10" height="5" fill="#ffc969"/>
  <!-- Question Mark / Idea Sparkle above Head -->
  <rect x="29" y="3" width="6" height="3" fill="#ffe77a"/>
  <rect x="33" y="6" width="3" height="4" fill="#ffe77a"/>
  <rect x="31" y="10" width="3" height="2" fill="#ffe77a"/>
  <rect x="31" y="13" width="3" height="2" fill="#ffe77a"/>

  <!-- Wings (Resting / Folded slightly) -->
  <rect x="3" y="20" width="12" height="8" fill="#9de3cf"/>
  <rect x="2" y="27" width="14" height="10" fill="#69cbb9"/>
  <rect x="49" y="20" width="12" height="8" fill="#9de3cf"/>
  <rect x="48" y="27" width="14" height="10" fill="#69cbb9"/>

  <!-- Head & Cheeks -->
  <rect x="17" y="15" width="30" height="26" fill="#427b86"/>
  <rect x="14" y="22" width="36" height="16" fill="#427b86"/>
  <rect x="21" y="21" width="22" height="18" fill="#c0ece0"/>
  <rect x="19" y="27" width="26" height="10" fill="#c0ece0"/>

  <!-- Puzzled / Thoughtful Eyes (Brows arched) -->
  <rect x="22" y="24" width="6" height="2" fill="#10243f"/>
  <rect x="36" y="23" width="6" height="2" fill="#10243f"/>
  <rect x="23" y="26" width="5" height="7" fill="#10243f"/>
  <rect x="36" y="25" width="6" height="8" fill="#10243f"/>
  <!-- Eye Sparkles -->
  <rect x="24" y="26" width="2" height="3" fill="#ffffff"/>
  <rect x="38" y="25" width="2" height="3" fill="#ffffff"/>

  <!-- Pouting / Thinking Mouth -->
  <rect x="28" y="35" width="5" height="3" fill="#c96769"/>
  <!-- Hand on Chin -->
  <rect x="32" y="36" width="6" height="5" fill="#427b86"/>
  <rect x="34" y="37" width="4" height="4" fill="#c0ece0"/>

  <!-- Glowing Firefly Abdomen -->
  <rect x="22" y="39" width="20" height="12" fill="#e9ad5b"/>
  <rect x="18" y="43" width="28" height="10" fill="#e9ad5b"/>
  <rect x="23" y="48" width="18" height="9" fill="#ffd276"/>
  <rect x="27" y="55" width="10" height="6" fill="#ffe29a"/>

  <!-- Legs -->
  <rect x="13" y="42" width="7" height="10" fill="#10243f"/>
  <rect x="44" y="42" width="7" height="10" fill="#10243f"/>
  <rect x="23" y="57" width="7" height="6" fill="#10243f"/>
  <rect x="34" y="57" width="7" height="6" fill="#10243f"/>

  <!-- Ambient Golden Firefly Dust -->
  <rect x="5" y="8" width="4" height="4" fill="#ffe29a"/>
  <rect x="55" y="12" width="4" height="4" fill="#ffe29a"/>
  <rect x="7" y="51" width="3" height="3" fill="#ffe29a"/>
  <rect x="53" y="51" width="4" height="4" fill="#ffe29a"/>
</svg>
